<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Empat tahap kerja Origami Studio</title>
  <desc id="d">Diagram empat kotak berurutan: Discovery, Strategi, Desain, dan Peluncuran, dihubungkan panah.</desc>
  <rect width="1000" height="340" rx="24" fill="#f6f6fd"/>
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="70" width="200" height="200" rx="22" fill="#fff" stroke="#e3e4f4" stroke-width="2"/>
      <circle cx="130" cy="130" r="30" fill="#e6e7fb"/><text x="130" y="141" font-size="30" font-weight="800" fill="#3b3fd1">1</text>
      <text x="130" y="205" font-size="25" font-weight="800" fill="#12123a">Discovery</text>
      <text x="130" y="236" font-size="16" fill="#5d5f86">Memahami bisnis</text>
    </g>
    <g>
      <rect x="280" y="70" width="200" height="200" rx="22" fill="#fff" stroke="#e3e4f4" stroke-width="2"/>
      <circle cx="380" cy="130" r="30" fill="#e6e7fb"/><text x="380" y="141" font-size="30" font-weight="800" fill="#3b3fd1">2</text>
      <text x="380" y="205" font-size="25" font-weight="800" fill="#12123a">Strategi</text>
      <text x="380" y="236" font-size="16" fill="#5d5f86">Arah dan konsep</text>
    </g>
    <g>
