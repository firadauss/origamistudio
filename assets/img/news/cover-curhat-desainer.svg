<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Ilustrasi laptop desainer dengan nama file revisi ke-27</title>
  <desc id="d">Laptop menampilkan nama file logo_FINAL_fix_v27.psd, di sebelahnya ada secangkir kopi dan sticky note bertuliskan revisi ke-27.</desc>
  <rect width="1200" height="630" fill="#fff4d6"/>
  <circle cx="1020" cy="120" r="150" fill="#ffe7a3" opacity=".7"/>
  <rect x="0" y="470" width="1200" height="160" fill="#f3d58a"/>
  <g>
    <rect x="260" y="130" width="560" height="340" rx="22" fill="#2b2c58"/>
    <rect x="285" y="155" width="510" height="290" rx="10" fill="#f6f6fd"/>
    <rect x="285" y="155" width="510" height="38" rx="10" fill="#3b3fd1"/>
    <circle cx="308" cy="174" r="7" fill="#ff8a8a"/><circle cx="330" cy="174" r="7" fill="#ffd36e"/><circle cx="352" cy="174" r="7" fill="#7fe0a0"/>
    <text x="540" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="800" fill="#12123a">logo_FINAL_fix_v27.psd</text>
    <text x="540" y="340" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" fill="#5d5f86">(ini sudah beneran final, katanya)</text>
