    <text x="980" y="305" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="54" font-weight="800" fill="#d64545">ke-27</text>
    <text x="980" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" fill="#12123a">"dikit aja"</text>
